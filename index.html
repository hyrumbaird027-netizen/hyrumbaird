<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyrum Baird</title>
<meta name="description" content="Hyrum Baird: tenor saxophonist, literary critic, and student at BYU.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #0D0D0D;
    --ink: #F3E9D2;
    --brass: #D4AF37;
    --muted: #B8A57A;
    --rule: #5C4A1E;
    --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
    --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-size: 1.125rem;
    line-height: 1.65;
  }
  img { max-width: 100%; display: block; }
  a { color: var(--brass); text-underline-offset: 0.18em; }
  a:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }

  .wrap {
    max-width: 68rem;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  /* Hero: the name set large, like a marquee, beside a photo */
  header {
    display: grid;
    gap: 2.5rem;
    padding: 4rem 0 3rem;
    border-bottom: 3px solid var(--brass);
  }
  @media (min-width: 52rem) {
    header { grid-template-columns: 1.35fr 1fr; align-items: end; gap: 3rem; }
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(4.5rem, 17vw, 10.5rem);
    line-height: 0.82;
    letter-spacing: -0.01em;
  }
  h1 span { display: block; }
  h1 span + span { padding-left: 0.6em; color: var(--brass); }
  .portrait {
    position: relative;
    z-index: 0;
    margin: 0 0.9rem 0 0;
  }
  .portrait img {
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    object-position: 50% 10%;
  }
  /* Side by side, the photo is cropped to exactly the height of the name */
  @media (min-width: 52rem) {
    header { align-items: stretch; }
    .portrait img {
      position: absolute;
      inset: 0;
      height: 100%;
      aspect-ratio: auto;
      object-position: 50% 4%;
    }
  }
  /* Offset gold frame behind the photo */
  .portrait::before {
    content: "";
    position: absolute;
    inset: 0.9rem -0.9rem -0.9rem 0.9rem;
    border: 2px solid var(--brass);
    z-index: -1;
  }

  h2 {
    margin: 0 0 0.75rem;
    font-family: var(--display);
    font-weight: 500;
    font-size: 2.4rem;
    line-height: 1;
  }

  /* Gigs: pulled live from the Gigs calendar in Google Calendar */
  .gigs {
    padding: 3rem 0 3.5rem;
  }
  .gigs h2 { font-size: clamp(3rem, 9vw, 4.5rem); font-weight: 800; color: var(--brass); margin-bottom: 1.5rem; }
  .gig-list { list-style: none; margin: 0; padding: 0; }
  .gig {
    display: grid;
    grid-template-columns: 4.5rem 1fr;
    gap: 1.25rem;
    align-items: center;
    padding: 1.1rem 0;
    border-top: 1px solid var(--rule);
  }
  .gig:last-child { border-bottom: 1px solid var(--rule); }
  .gig-date {
    font-family: var(--display);
    line-height: 0.9;
    text-align: center;
    text-transform: uppercase;
    color: var(--brass);
  }
  .gig:has(.gig-tickets) { grid-template-columns: 4.5rem 1fr auto; }
  .gig-tickets {
    padding: 0.45rem 0.9rem;
    border: 1.5px solid var(--brass);
    font-family: var(--display);
    font-size: 1.05rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
  }
  .gig-tickets:hover { background: var(--brass); color: var(--paper); }
  @media (max-width: 30rem) {
    .gig:has(.gig-tickets) { grid-template-columns: 4.5rem 1fr; }
    .gig-tickets { grid-column: 2; justify-self: start; }
  }
  .gig-month { display: block; font-size: 1.05rem; font-weight: 500; letter-spacing: 0.08em; }
  .gig-day { display: block; font-size: 2.75rem; font-weight: 800; }
  .gig-title { margin: 0; font-size: 1.25rem; font-weight: 600; line-height: 1.3; }
  .gig-meta { margin: 0.15rem 0 0; color: var(--muted); font-size: 1rem; }
  .gig.past { opacity: 0.45; }
  .gig.past .gig-title { text-decoration: line-through; }
  .gig-status { padding: 1.1rem 0; border-top: 1px solid var(--rule); color: var(--muted); }
  .gig-note { margin: 1rem 0 0; font-size: 0.95rem; color: var(--muted); }

  footer {
    border-top: 1px solid var(--rule);
    padding: 2rem 0 3rem;
    color: var(--muted);
    font-size: 1rem;
  }
  footer p { margin: 0; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><span>Hyrum</span><span>Baird</span></h1>
      <figure class="portrait">
        <img src="hyrum-sax.jpg" alt="Hyrum Baird playing tenor saxophone" width="931" height="931">
      </figure>
    </header>

    <section class="gigs" aria-labelledby="gigs-heading">
      <h2 id="gigs-heading">Gigs</h2>
      <ol class="gig-list" id="gig-list">
        <li class="gig-status">Loading…</li>
      </ol>
    </section>

    <footer>
      <p>Contact me at <a href="mailto:hyrumgbaird@gmail.com">hyrumgbaird@gmail.com</a></p>
    </footer>
  </div>

  <script>
  // Gigs come from the public "Gigs" calendar in Google Calendar.
  // Add an event there (even from your phone) and it shows up here on the next page load.
  (function () {
    const CALENDAR_ID = "089e2d1bf478747ed4516d07508622526ab7394a55574b9c022dec10d8f907ba@group.calendar.google.com";
    const API_KEY = "AIzaSyDTNXo1zxMiOaAIL87a2IanZwWY7vc-KyQ";
    const MAX_UPCOMING = 12;
    const MAX_PAST = 3;           // recent past gigs, shown crossed out
    const PAST_WINDOW_DAYS = 90;

    // Ticket links for BYU Synthesis concerts, by concert date.
    // A Synthesis gig on one of these dates gets a Tickets button.
    const TICKETS = {
      "2026-10-23": "https://byutickets.evenue.net/events/6007",
      "2026-10-31": "https://www.tickettailor.com/events/byufamilyconcerts/2372026",
      "2026-11-18": "https://byutickets.evenue.net/events/6018",
      "2027-02-20": "https://byutickets.evenue.net/events/6032",
      "2027-02-21": "https://byutickets.evenue.net/events/6032", // Ellington, in case the calendar has it a day late
      "2027-03-31": "https://byutickets.evenue.net/events/6043"
    };

    const list = document.getElementById("gig-list");
    const now = new Date();

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function fmt(date, opts) {
      return new Intl.DateTimeFormat("en-US", opts).format(date);
    }

    // All-day events have only a date, so read it in UTC to keep the day from shifting.
    function dateParts(ev, tz) {
      if (ev.start.date) {
        const [y, m, d] = ev.start.date.split("-").map(Number);
        const day = new Date(Date.UTC(y, m - 1, d, 12));
        return {
          month: fmt(day, { month: "short", timeZone: "UTC" }),
          day: String(d),
          weekday: fmt(day, { weekday: "short", timeZone: "UTC" }),
          time: null
        };
      }
      const start = new Date(ev.start.dateTime);
      return {
        month: fmt(start, { month: "short", timeZone: tz }),
        day: fmt(start, { day: "numeric", timeZone: tz }),
        weekday: fmt(start, { weekday: "short", timeZone: tz }),
        time: fmt(start, { hour: "numeric", minute: "2-digit", timeZone: tz })
      };
    }

    // "Peery's Egyptian Theater, 2415 Washington Blvd, Ogden, UT 84401, USA" -> "Peery's Egyptian Theater, Ogden".
    // Drops the street address, state, ZIP and country, and the venue name when the gig is already named after it.
    function venueLabel(location, title) {
      let parts = location.split(",").map(s => s.trim()).filter(Boolean);
      if (/^(USA|United States)$/i.test(parts[parts.length - 1])) parts.pop();
      if (parts.length > 1 && /^[A-Z]{2}( \d{5})?$/.test(parts[parts.length - 1])) parts.pop();
      parts = parts.filter(p => !/^\d/.test(p) && p.toLowerCase() !== (title || "").toLowerCase());
      return parts.join(", ") || location;
    }

    // The gig's start date as "YYYY-MM-DD" in the calendar's time zone.
    function dateKey(ev, tz) {
      if (ev.start.date) return ev.start.date;
      return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" })
        .format(new Date(ev.start.dateTime));
    }

    function endOf(ev) {
      return new Date(ev.end.dateTime || ev.end.date);
    }

    function renderGig(ev, tz, isPast) {
      const p = dateParts(ev, tz);
      const li = el("li", "gig" + (isPast ? " past" : ""));

      const date = el("div", "gig-date");
      date.append(el("span", "gig-month", p.month), el("span", "gig-day", p.day));

      const info = el("div");
      info.append(el("h3", "gig-title", ev.summary || "Gig"));
      const meta = el("p", "gig-meta");
      meta.append([p.weekday, p.time].filter(Boolean).join(" · "));
      if (ev.location) {
        meta.append(" · ");
        const a = el("a", null, venueLabel(ev.location, ev.summary));
        a.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(ev.location);
        a.target = "_blank";
        a.rel = "noopener";
        meta.append(a);
      }
      info.append(meta);
      li.append(date, info);

      const ticketUrl = !isPast && /synthesis/i.test(ev.summary || "") && TICKETS[dateKey(ev, tz)];
      if (ticketUrl) {
        const t = el("a", "gig-tickets", "Tickets");
        t.href = ticketUrl;
        t.target = "_blank";
        t.rel = "noopener";
        li.append(t);
      }
      return li;
    }

    function render(items, tz, note) {
      const upcoming = items.filter(ev => endOf(ev) >= now).slice(0, MAX_UPCOMING);
      const past = items.filter(ev => endOf(ev) < now).slice(-MAX_PAST).reverse();

      list.replaceChildren();
      if (!upcoming.length) {
        list.append(el("li", "gig-status", "No gigs on the books. Check back soon."));
      }
      upcoming.forEach(ev => list.append(renderGig(ev, tz, false)));
      past.forEach(ev => list.append(renderGig(ev, tz, true)));
      if (note) list.after(el("p", "gig-note", note));
    }

    // Example gigs, used only when previewing the file on your computer and the real
    // calendar can't be read (Google only answers requests from hyrumbaird.com) or is empty.
    function sampleItems() {
      const at = (days, hour) => {
        const d = new Date(now);
        d.setDate(d.getDate() + days);
        d.setHours(hour, 0, 0, 0);
        return d.toISOString();
      };
      const ev = (title, days, hour, location) => ({
        summary: title,
        location,
        start: { dateTime: at(days, hour) },
        end: { dateTime: at(days, hour + 2) }
      });
      return [
        ev("BYU Synthesis", -20, 19, "Concert Hall, BYU Music Building, Provo, UT"),
        ev("Fancy Burger", 6, 18, "Fancy Burger, 1132 S State St, Orem, UT 84097"),
        ev("BYU Synthesis", 14, 19, "Concert Hall, BYU Music Building, Provo, UT"),
        ev("Stonefed", 22, 21, "The Hog Wallow Pub, 3200 E Big Cottonwood Canyon Rd, Cottonwood Heights, UT")
      ];
    }

    const url = "https://www.googleapis.com/calendar/v3/calendars/" + encodeURIComponent(CALENDAR_ID) +
      "/events?key=" + API_KEY +
      "&singleEvents=true&orderBy=startTime&maxResults=50" +
      "&timeMin=" + encodeURIComponent(new Date(now - PAST_WINDOW_DAYS * 864e5).toISOString());

    const isLocalPreview = location.protocol === "file:";
    const showSamples = () =>
      render(sampleItems(), "America/Denver", "Preview: these are sample gigs. The live site shows your real calendar.");

    fetch(url)
      .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(data => {
        const items = data.items || [];
        if (isLocalPreview && !items.length) return showSamples();
        render(items, data.timeZone || "America/Denver");
      })
      .catch(() => {
        if (isLocalPreview) return showSamples();
        list.replaceChildren(el("li", "gig-status", "Couldn't load gigs right now."));
      });
  })();
  </script>
</body>
</html>
